<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- The cuju mark. The letters C, U, J and U stand in a two by two grid, each a rounded square
         stroke with two copies behind it, offset down and to the right in darker grays, on a dark
         square with rounded corners and a gray border that stays three quarters white over its top
         left half and darkens to a quarter white at the bottom right, as the light falls on the
         letters. Each gray brightens outward from near the middle of the grid. ci/make_logo.py
         renders the PNG icons of the page from this file and writes the bare marks cuju-mark.svg
         and cuju-mark-light.svg from its letters. -->
    <defs>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#bfbfbf"/>
            <stop offset="0.5" stop-color="#bfbfbf"/>
            <stop offset="1" stop-color="#404040"/>
        </linearGradient>
        <radialGradient id="back" gradientUnits="userSpaceOnUse" cx="178" cy="178" r="256">
            <stop offset="0" stop-color="#47484a"/>
            <stop offset="1" stop-color="#7c7c7d"/>
        </radialGradient>
        <radialGradient id="middle" gradientUnits="userSpaceOnUse" cx="178" cy="178" r="256">
            <stop offset="0" stop-color="#6a6a6c"/>
            <stop offset="1" stop-color="#b3b3b4"/>
        </radialGradient>
        <radialGradient id="front" gradientUnits="userSpaceOnUse" cx="178" cy="178" r="256">
            <stop offset="0" stop-color="#bbbbbb"/>
            <stop offset="1" stop-color="#d1d1d1"/>
        </radialGradient>
    </defs>
    <g id="frame">
        <rect width="512" height="512" rx="112" fill="url(#ring)"/>
        <rect x="32" y="32" width="448" height="448" rx="80" fill="#202124"/>
    </g>
    <g id="mark" transform="translate(64 64)">
